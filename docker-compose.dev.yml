services:
  api:
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: '1'
      CI: 'true'
    command: >-
      sh -c "pnpm prisma:generate
      && pnpm prisma migrate deploy
      && pnpm dev"
    volumes:
      - ./api:/app/api
      # Volume anônimo: preserva o node_modules instalado na imagem, que o
      # bind mount acima esconderia (o clone não tem node_modules no host).
      - /app/api/node_modules

  web:
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: '1'
      WATCHPACK_POLLING: 'true'
      CI: 'true'
    command: >-
      sh -c "pnpm exec next dev -H 0.0.0.0 -p 3000"
    volumes:
      - ./web:/app/web
      # Volume anônimo: preserva o node_modules instalado na imagem.
      - /app/web/node_modules
